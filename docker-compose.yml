services:

  fastapi:
    image: ghcr.io/<YOUR_GITHUB_USERNAME>/fastapi-app:${IMAGE_TAG:-latest}
    container_name: fastapi-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
