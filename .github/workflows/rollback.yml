name: Rollback FastAPI App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to rollback"
        required: true
        default: "v19"


jobs:

  rollback:

    runs-on: self-hosted


    steps:

      - name: Show rollback version
        run: |
          echo "Rolling back to ${{ inputs.version }}"


      - name: Checkout selected release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          clean: false
          fetch-depth: 0


      - name: Stop current deployment
        run: |
          docker compose down


      - name: Build rollback version
        run: |
          docker compose build --no-cache


      - name: Start rollback deployment
        run: |
          docker compose up -d


      - name: Verify containers
        run: |
          docker ps


      - name: Health check
        run: |
          sleep 10
          curl -f http://localhost:8000/health

