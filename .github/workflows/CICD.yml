name: Production Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      action:
        description: Action
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback

      rollback_release_tag:
        description: GitHub release tag to rollback
        required: false
        type: string

      rollback_commit_sha:
        description: Commit SHA to rollback
        required: false
        type: string

      rollback_revision:
        description: ECS task revision
        required: false
        type: string

      revisions_back:
        description: Rollback number of revisions
        required: false
        default: "1"
        type: string


concurrency:
  group: production-deployment
  cancel-in-progress: false


env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 380277571706

  ECR_REPOSITORY: fastapi-ecr

  ECS_CLUSTER: fastapi-ecs
  ECS_SERVICE: ecs-task-service
  ECS_TASK_DEFINITION: ecs-task

  CONTAINER_NAME: Main



jobs:


# ============================================================
# DEPLOY
# ============================================================

  deploy:


    if: github.event_name == 'push' || github.event.inputs.action == 'deploy'

    runs-on: self-hosted

    timeout-minutes: 60


    permissions:
      contents: write


    steps:


    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0



    - name: AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}



    - name: Login ECR
      uses: aws-actions/amazon-ecr-login@v2



    - name: Generate Image Tag
      id: tag
      run: |

        SHORT_SHA=${GITHUB_SHA:0:7}

        IMAGE_TAG=${SHORT_SHA}-${GITHUB_RUN_NUMBER}

        echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT



    - name: Build Docker Image
      run: |

        docker build \
        -t $ECR_REPOSITORY:${{ steps.tag.outputs.image_tag }} .



    - name: Tag Image
      run: |

        docker tag \
        $ECR_REPOSITORY:${{ steps.tag.outputs.image_tag }} \
        $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${{ steps.tag.outputs.image_tag }}



    - name: Push Image
      run: |

        docker push \
        $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${{ steps.tag.outputs.image_tag }}



    - name: Download Current Task Definition
      run: |

        aws ecs describe-task-definition \
        --task-definition $ECS_TASK_DEFINITION \
        --query taskDefinition \
        > task.json



    - name: Create New Task Definition
      id: task
      run: |


        IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${{ steps.tag.outputs.image_tag }}"


        jq \
        --arg IMAGE "$IMAGE" \
        --arg NAME "$CONTAINER_NAME" \
        '

        .containerDefinitions |= map(

          if .name == $NAME

          then .image=$IMAGE

          else .

          end

        )

        |

        del(
        .taskDefinitionArn,
        .revision,
        .status,
        .requiresAttributes,
        .compatibilities,
        .registeredAt,
        .registeredBy
        )

        ' task.json > new-task.json



        ARN=$(aws ecs register-task-definition \
        --cli-input-json file://new-task.json \
        --query taskDefinition.taskDefinitionArn \
        --output text)



        echo "arn=$ARN" >> $GITHUB_OUTPUT



    - name: Deploy ECS
      run: |


        aws ecs update-service \
        --cluster $ECS_CLUSTER \
        --service $ECS_SERVICE \
        --task-definition ${{ steps.task.outputs.arn }} \
        --force-new-deployment



    - name: Wait ECS
      run: |

        aws ecs wait services-stable \
        --cluster $ECS_CLUSTER \
        --services $ECS_SERVICE



    - name: Create GitHub Release
      if: success()
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        TAG=$(date +%Y.%m.%d)-${GITHUB_SHA:0:7}-v${GITHUB_RUN_NUMBER}
        echo "Creating release: $TAG"
        BODY=$(cat <<EOF
        Production deployment completed successfully.
        Commit:
        $GITHUB_SHA
        Image:
        $ECR_REPOSITORY:${{ steps.tag.outputs.image_tag }}
        Task Definition:
        ${{ steps.task.outputs.arn }}
        Triggered By:
        ${{ github.actor }}
        EOF
        )
        curl \
        -X POST \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
        -H "Accept: application/vnd.github+json" \
        https://api.github.com/repos/${{ github.repository }}/releases \
        -d "$(jq -n \
          --arg tag "$TAG" \
          --arg name "Production $TAG" \
          --arg body "$BODY" \
          '{
            tag_name:$tag,
            name:$name,
            body:$body,
            draft:false,
            prerelease:false
          }')"
        echo "✅ Release created: $TAG"



# ============================================================
# ROLLBACK
# ============================================================


  rollback:


    if: github.event_name == 'workflow_dispatch' &&
        github.event.inputs.action == 'rollback'


    runs-on: self-hosted


    timeout-minutes: 60


    permissions:
      contents: write


    steps:


    - name: AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4

      with:

        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        aws-region: ${{ env.AWS_REGION }}




    - name: Find Rollback Task Definition
      id: rollback

      env:
        GH_TOKEN: ${{ github.token }}

      run: |


        CURRENT=$(aws ecs describe-services \
        --cluster $ECS_CLUSTER \
        --services $ECS_SERVICE \
        --query services[0].taskDefinition \
        --output text)



        echo "Current:"
        echo $CURRENT



        # Rollback by ECS revision

        if [ -n "${{ github.event.inputs.rollback_revision }}" ]

        then


          TARGET="arn:aws:ecs:$AWS_REGION:$AWS_ACCOUNT_ID:task-definition/$ECS_TASK_DEFINITION:${{ github.event.inputs.rollback_revision }}"


        else


          BACK=${{ github.event.inputs.revisions_back }}


          if [ -z "$BACK" ]

          then

          BACK=1

          fi



          LIST=$(aws ecs list-task-definitions \
          --family-prefix $ECS_TASK_DEFINITION \
          --sort DESC \
          --query taskDefinitionArns \
          --output text)



          TARGET=$(echo $LIST | tr '\t' '\n' | sed -n "$((BACK+1))p")



        fi



        if [ -z "$TARGET" ]
        then
          echo "::error::Could not resolve a rollback target. Check that the revision/revisions_back you requested actually exists (family: $ECS_TASK_DEFINITION)."
          exit 1
        fi



        echo "Rollback target:"
        echo $TARGET



        echo "target=$TARGET" >> $GITHUB_OUTPUT




    - name: Rollback ECS


      run: |


        aws ecs update-service \
        --cluster $ECS_CLUSTER \
        --service $ECS_SERVICE \
        --task-definition ${{ steps.rollback.outputs.target }} \
        --force-new-deployment




    - name: Wait Rollback


      run: |


        aws ecs wait services-stable \
        --cluster $ECS_CLUSTER \
        --services $ECS_SERVICE



    - name: Rollback Complete

      run: |

        echo "Rollback completed"
        echo "Running:"
        echo "${{ steps.rollback.outputs.target }}"



    - name: Create Rollback Release
      if: success()
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        TAG=$(date +%Y.%m.%d)-rollback-${GITHUB_RUN_NUMBER}
        BODY=$(cat <<EOF
        Production rollback completed.
        Rollback Task Definition:
        ${{ steps.rollback.outputs.target }}
        Triggered By:
        ${{ github.actor }}
        EOF
        )
        curl \
        -X POST \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
        -H "Accept: application/vnd.github+json" \
        https://api.github.com/repos/${{ github.repository }}/releases \
        -d "$(jq -n \
          --arg tag "$TAG" \
          --arg name "Rollback $TAG" \
          --arg body "$BODY" \
          '{
            tag_name:$tag,
            name:$name,
            body:$body,
            draft:false,
            prerelease:false
          }')"
        echo "✅ Rollback release created"
